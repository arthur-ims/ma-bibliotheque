<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://tailwindcss.com"></script>
    <title>Ma Bibliothèque</title>
  </head>
  <body class="bg-gray-100 text-gray-900 font-sans antialiased">
    <div id="app" class="min-h-screen bg-gray-100 max-w-md mx-auto shadow-2xl min-w-[320px] flex flex-col">
      <header class="sticky top-0 bg-white border-b border-gray-200 px-5 py-4 z-20 shadow-sm">
        <h1 class="text-xl font-bold tracking-tight">Ma Bibliothèque</h1>
        <p id="counter" class="text-xs text-indigo-600 font-medium mt-0.5">Chargement de la collection...</p>

        <div class="mt-4 space-y-2.5">
          <select id="genreSelect" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer">
            <option value="">📚 Tous les genres</option>
          </select>
          <select id="subCatSelect" class="w-full bg-indigo-50/50 border border-indigo-100 text-indigo-900 rounded-xl px-3 py-2.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer hidden">
            <option value="">📂 Toutes les sous-catégories</option>
          </select>
        </div>
      </header>

      <main id="bookList" class="p-4 flex-1 space-y-3 overflow-y-auto">
        <div class="text-center py-12 text-gray-400 text-sm">Connexion à Google Sheets...</div>
      </main>
    </div>

    <script>
      const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQT573CUIhWzhVpP1iv2u57K1INIi5CQ69a40Y--w5qQUOwhA_djHd4wlPYkCjvU3OGHe1
      CRZXe6i4o/gviz/tq?sheet=Livres&tqx=out:json";

      let allBooks = [];
      const bookListEl = document.getElementById('bookList');
      const counterEl = document.getElementById('counter');
      const genreSelect = document.getElementById('genreSelect');
      const subCatSelect = document.getElementById('subCatSelect');

      fetch(SHEET_URL)
        .then(res => res.text())
        .then(text => {
          const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);/);
          if (!match) throw new Error("Format de réponse Google invalide");
          
          const data = JSON.parse(match[1]);
          allBooks = data.table.rows
            .map((row, index) => {
              const cells = row.c || [];
              return {
                id: index,
                titre: cells[0]?.v?.toString().trim() || '',
                auteur: cells[1]?.v?.toString().trim() || 'Auteur inconnu',
                genre: cells[2]?.v?.toString().trim() || '',
                sous_categorie: cells[3]?.v?.toString().trim() || '',
                editeur: cells[4]?.v?.toString().trim() || '',
                format: cells[5]?.v?.toString().trim() || ''
                
              };
            })
            .filter(b => b.titre !== '' && b.genre !== '' && b.titre.toLowerCase() !== 'titre');

          counterEl.textContent = `${allBooks.length} ouvrages répertoriés`;
          populateGenres();
          renderBooks();
        })
        .catch(err => {
          console.error(err);
          bookListEl.innerHTML = `<div class="text-center py-12 text-rose-500 text-sm font-medium">❌ Erreur de liaison Google Sheets</div>`;
        });

      function populateGenres() {
        const genres = [...new Set(allBooks.map(b => b.genre))].filter(Boolean).sort();
        genres.forEach(g => {
          const opt = document.createElement('option');
          opt.value = g;
          opt.textContent = g;
          genreSelect.appendChild(opt);
        });
      }

      function updateSubCategories(selectedGenre) {
        subCatSelect.innerHTML = '<option value="">📂 Toutes les sous-catégories</option>';
        if (!selectedGenre) {
          subCatSelect.classList.add('hidden');
          return;
        }
        const subCats = [...new Set(allBooks.filter(b => b.genre === selectedGenre).map(b => b.sous_categorie))].filter(Boolean).sort();
        if (subCats.length > 0) {
          subCats.forEach(sc => {
            const opt = document.createElement('option');
            opt.value = sc;
            opt.textContent = sc;
            subCatSelect.appendChild(opt);
          });
          subCatSelect.classList.remove('hidden');
        } else {
          subCatSelect.classList.add('hidden');
        }
      }

      function renderBooks() {
        const selGenre = genreSelect.value;
        const selSubCat = subCatSelect.value;

        const filtered = allBooks.filter(b => {
          const mGenre = selGenre ? b.genre === selGenre : true;
          const mSubCat = selSubCat ? b.sous_categorie === selSubCat : true;
          return mGenre && mSubCat;
        });

        if (filtered.length === 0) {
          bookListEl.innerHTML = '<div class="text-center py-12 text-gray-400 text-sm bg-white rounded-2xl border border-dashed p-6">Aucun ouvrage trouvé.</div>';
          return;
        }

        bookListEl.innerHTML = filtered.map(b => `
          <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm space-y-2">
            <div class="flex justify-between items-start gap-2">
              <span class="inline-block text-[10px] bg-gray-100 text-gray-600 font-bold px-2 py-0.5 rounded">${b.sous_categorie || "Général"}</span>
              \${b.format ? `<span class="text-[10px] text-gray-400 font-medium uppercase">\${b.format}</span>` : ''}
            </div>
            <h3 class="font-bold text-gray-800 text-base leading-snug">\${b.titre}</h3>
            \${b.auteur !== 'Auteur inconnu' && b.auteur !== '' ? `<p class="text-xs text-gray-500 font-medium">par \${b.auteur}</p>` : ''}
            \${b.editeur ? `<div class="pt-1 border-t border-gray-50 text-[11px] text-gray-400">Éditeur : <span class="font-medium text-gray-600">\${b.editeur}</span></div>` : ''}
          </div>
        `).join('');
      }

      genreSelect.addEventListener('change', (e) => {
        updateSubCategories(e.target.value);
        renderBooks();
      });
      subCatSelect.addEventListener('change', renderBooks);
    </script>
  </body>
</html>
