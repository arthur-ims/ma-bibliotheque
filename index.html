<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Ma Bibliothèque</title>
  </head>
  <body class="bg-gray-100 text-gray-900 font-sans antialiased relative">
    <div id="app" class="min-h-screen bg-gray-100 max-w-md mx-auto shadow-2xl min-w-[320px] flex flex-col relative pb-20">
      <header class="sticky top-0 bg-white border-b border-gray-200 px-5 py-4 z-20 shadow-sm">
        <h1 class="text-xl font-bold tracking-tight">Ma Bibliothèque</h1>
        
        <div class="mt-4 space-y-2.5">
          <select id="genreSelect" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer">
            <option value="">📚 Choisissez un genre</option>
          </select>
          <select id="subCatSelect" class="w-full bg-indigo-50/50 border border-indigo-100 text-indigo-900 rounded-xl px-3 py-2.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer hidden">
            <option value="">📂 Toutes les sous-catégories</option>
          </select>
        </div>
      </header>

      <main id="bookList" class="p-4 flex-1 space-y-3 overflow-y-auto">
        <div class="text-center py-12 text-gray-400 text-sm">Connexion à Google Sheets...</div>
      </main>

      <!-- Bouton Wishlist Fixé en bas -->
      <div class="fixed bottom-0 w-full max-w-md bg-white/90 backdrop-blur-sm border-t border-gray-200 p-4 z-20">
        <button id="openWishlist" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl shadow-lg hover:bg-indigo-700 hover:-translate-y-0.5 transition-all duration-300">
          🎁 Voir ma Wishlist (Budget)
        </button>
      </div>
    </div>

    <!-- Modale Wishlist -->
    <div id="wishlistModal" class="fixed inset-0 bg-gray-900/60 hidden z-50 flex-col items-center justify-end">
      <div class="bg-gray-50 w-full max-w-md h-[85vh] rounded-t-3xl flex flex-col shadow-2xl transform transition-transform translate-y-full" id="wishlistContent">
        <div class="p-5 border-b border-gray-200 bg-white rounded-t-3xl flex justify-between items-center sticky top-0">
          <h2 class="text-lg font-bold">🎁 Wishlist par Budget</h2>
          <button id="closeWishlist" class="text-gray-400 hover:text-gray-800 text-3xl leading-none">&times;</button>
        </div>
        
        <div class="p-4 bg-white border-b border-gray-100 flex gap-2 overflow-x-auto hide-scrollbars">
          <button class="budget-btn flex-shrink-0 px-4 py-2 bg-gray-100 text-gray-600 rounded-full text-sm font-bold hover:bg-indigo-100 hover:text-indigo-700 transition-colors" data-max="10">- de 10€</button>
          <button class="budget-btn flex-shrink-0 px-4 py-2 bg-gray-100 text-gray-600 rounded-full text-sm font-bold hover:bg-indigo-100 hover:text-indigo-700 transition-colors" data-max="20">- de 20€</button>
          <button class="budget-btn flex-shrink-0 px-4 py-2 bg-gray-100 text-gray-600 rounded-full text-sm font-bold hover:bg-indigo-100 hover:text-indigo-700 transition-colors" data-max="50">- de 50€</button>
          <button class="budget-btn flex-shrink-0 px-4 py-2 bg-gray-100 text-gray-600 rounded-full text-sm font-bold hover:bg-indigo-100 hover:text-indigo-700 transition-colors" data-min="50">50€ et +</button>
        </div>

        <div id="wishlistResults" class="p-4 flex-1 overflow-y-auto space-y-3">
          <div class="text-center flex flex-col items-center justify-center py-16 px-4 bg-white rounded-3xl border border-dashed border-gray-200 shadow-sm">
            <span class="text-3xl mb-3">💸</span>
            <p class="text-gray-500 font-medium text-sm">Sélectionnez un budget ci-dessus.</p>
          </div>
        </div>
      </div>
    </div>

    <style>
      .hide-scrollbars::-webkit-scrollbar { display: none; }
      .hide-scrollbars { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

    <script>
      var SHEET_URL = window.location.hash.substring(1);
      var allBooks = [];
      var bookListEl = document.getElementById('bookList');
      var genreSelect = document.getElementById('genreSelect');
      var subCatSelect = document.getElementById('subCatSelect');

      // Éléments Wishlist
      var wishlistModal = document.getElementById('wishlistModal');
      var wishlistContent = document.getElementById('wishlistContent');
      var openWishlistBtn = document.getElementById('openWishlist');
      var closeWishlistBtn = document.getElementById('closeWishlist');
      var wishlistResults = document.getElementById('wishlistResults');
      var budgetBtns = document.querySelectorAll('.budget-btn');

      fetch(SHEET_URL)
        .then(function(res) { return res.text(); })
        .then(function(text) {
          var match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);/);
          if (!match) throw new Error("Format de réponse Google Sheets invalide");
          
          var data = JSON.parse(match[1]);
          allBooks = data.table.rows
            .map(function(row, index) {
              var cells = row.c || [];
              return {
                id: index,
                titre: cells[0]?.v?.toString().trim() || '',
                auteur: cells[1]?.v?.toString().trim() || 'Auteur inconnu',
                genre: cells[2]?.v?.toString().trim() || '',
                sous_categorie: cells[3]?.v?.toString().trim() || '',
                editeur: cells[4]?.v?.toString().trim() || '',
                // Colonne F (index 5) est maintenant le Prix
                prix: parseFloat((cells[5]?.v?.toString() || '0').replace(',', '.')) || 0 
              };
            })
            .filter(function(b) { 
              return b.titre !== '' && b.genre !== '' && b.titre.toLowerCase() !== 'titre'; 
            });

          populateGenres();
          renderBooks();
        })
        .catch(function(err) {
          console.error(err);
          bookListEl.innerHTML = '<div class="text-center py-12 text-rose-500 text-sm font-medium">❌ Erreur lors du chargement</div>';
        });

      function populateGenres() {
        var genres = [...new Set(allBooks.map(function(b) { return b.genre; }))].filter(Boolean).sort();
        genreSelect.innerHTML = '<option value="">📚 Choisissez un genre</option>';
        genres.forEach(function(g) {
          var opt = document.createElement('option');
          opt.value = g;
          opt.textContent = g;
          genreSelect.appendChild(opt);
        });
      }

      function updateSubCategories(selectedGenre) {
        subCatSelect.innerHTML = '<option value="">📂 Toutes les sous-catégories</option>';
        if (!selectedGenre) {
          subCatSelect.classList.add('hidden');
          return;
        }
        var subCats = [...new Set(allBooks.filter(function(b) { return b.genre === selectedGenre; }).map(function(b) { return b.sous_categorie; }))].filter(Boolean).sort();
        if (subCats.length > 0) {
          subCats.forEach(function(sc) {
            var opt = document.createElement('option');
            opt.value = sc;
            opt.textContent = sc;
            subCatSelect.appendChild(opt);
          });
          subCatSelect.classList.remove('hidden');
        } else {
          subCatSelect.classList.add('hidden');
        }
      }

      function generateBookHTML(b) {
        var html = '<div class="bg-white p-5 rounded-3xl border border-gray-100 shadow-sm space-y-2 transition-all duration-300 hover:shadow-xl hover:-translate-y-1 hover:border-indigo-100 cursor-default">';
        html += '  <div class="flex justify-between items-start gap-2">';
        html += '    <span class="inline-block text-[10px] bg-gray-100 text-gray-600 font-bold px-2 py-0.5 rounded">' + (b.sous_categorie || "Général") + '</span>';
        if (b.prix > 0) {
          html += '    <span class="text-[11px] text-green-600 font-bold bg-green-50 px-2 py-0.5 rounded-full">' + b.prix + ' €</span>';
        }
        html += '  </div>';
        html += '  <h3 class="font-bold text-gray-800 text-base leading-snug">' + b.titre + '</h3>';
        if (b.auteur !== 'Auteur inconnu' && b.auteur !== '') {
          html += '  <p class="text-xs text-gray-500 font-medium">par ' + b.auteur + '</p>';
        }
        if (b.editeur) {
          html += '  <div class="pt-1 border-t border-gray-50 text-[11px] text-gray-400">Éditeur : <span class="font-medium text-gray-600">' + b.editeur + '</span></div>';
        }
        html += '</div>';
        return html;
      }

      function renderBooks() {
        var selGenre = genreSelect.value;
        var selSubCat = subCatSelect.value;

        if (!selGenre) {
          bookListEl.innerHTML = '<div class="text-center flex flex-col items-center justify-center py-16 px-4 bg-white rounded-3xl border border-dashed border-gray-200 shadow-sm"><span class="text-4xl mb-4">📚</span><p class="text-gray-500 font-medium text-sm">Sélectionnez un genre ci-dessus pour découvrir les ouvrages.</p></div>';
          return;
        }

        var filtered = allBooks.filter(function(b) {
          var mGenre = selGenre ? b.genre === selGenre : true;
          var mSubCat = selSubCat ? b.sous_categorie === selSubCat : true;
          return mGenre && mSubCat;
        });

        filtered.sort(function(a, b) {
          var auteurA = (a.auteur || "").toLowerCase();
          var auteurB = (b.auteur || "").toLowerCase();
          if (auteurA < auteurB) return -1;
          if (auteurA > auteurB) return 1;

          var titreA = (a.titre || "").toLowerCase();
          var titreB = (b.titre || "").toLowerCase();
          if (titreA < titreB) return -1;
          if (titreA > titreB) return 1;

          return 0;
        });

        if (filtered.length === 0) {
          bookListEl.innerHTML = '<div class="text-center py-12 text-gray-400 text-sm bg-white rounded-3xl border border-dashed p-6">Aucun ouvrage trouvé.</div>';
          return;
        }

        var html = "";
        filtered.forEach(function(b) { html += generateBookHTML(b); });
        bookListEl.innerHTML = html;
      }

      genreSelect.addEventListener('change', function(e) {
        updateSubCategories(e.target.value);
        renderBooks();
      });
      subCatSelect.addEventListener('change', renderBooks);

      // Logique de la modale Wishlist
      openWishlistBtn.addEventListener('click', function() {
        wishlistModal.classList.remove('hidden');
        wishlistModal.classList.add('flex');
        setTimeout(function() {
          wishlistContent.classList.remove('translate-y-full');
        }, 10);
      });

      closeWishlistBtn.addEventListener('click', function() {
        wishlistContent.classList.add('translate-y-full');
        setTimeout(function() {
          wishlistModal.classList.add('hidden');
          wishlistModal.classList.remove('flex');
        }, 300);
      });

      // Filtres de prix
      budgetBtns.forEach(function(btn) {
        btn.addEventListener('click', function() {
          // Gérer le style actif
          budgetBtns.forEach(function(b) { b.classList.remove('bg-indigo-600', 'text-white'); b.classList.add('bg-gray-100', 'text-gray-600'); });
          this.classList.remove('bg-gray-100', 'text-gray-600');
          this.classList.add('bg-indigo-600', 'text-white');

          var maxPrice = parseFloat(this.getAttribute('data-max'));
          var minPrice = parseFloat(this.getAttribute('data-min'));

          var filtered = allBooks.filter(function(b) {
            if (b.prix === 0) return false; // Ignorer les livres sans prix
            if (maxPrice) return b.prix <= maxPrice;
            if (minPrice) return b.prix >= minPrice;
            return true;
          });

          // Tri par prix croissant
          filtered.sort(function(a, b) { return a.prix - b.prix; });

          if (filtered.length === 0) {
            wishlistResults.innerHTML = '<div class="text-center py-12 text-gray-400 text-sm bg-white rounded-3xl border border-dashed p-6">Aucun livre dans ce budget.</div>';
            return;
          }

          var html = "";
          filtered.forEach(function(b) { html += generateBookHTML(b); });
          wishlistResults.innerHTML = html;
        });
      });
    </script>
  </body>
</html>
